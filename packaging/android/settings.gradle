pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    plugins {
        id 'com.android.library' version '8.11.1'
        id 'org.jetbrains.kotlin.android' version '2.2.21'
        id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21'
        id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.21'
    }
}
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'HorizonAndroid'

// Experimental integration only. Default/release builds must not ship staged
// engines before overlay input routing, editor and distribution review exist.
if (providers.gradleProperty('experimentalJavaControls').orNull == 'true') {
    include ':input', ':layer'
    project(':input').projectDir = file('../../tests/control_engine_build/input')
    project(':layer').projectDir = file('../../tests/control_engine_build/layer')
}
