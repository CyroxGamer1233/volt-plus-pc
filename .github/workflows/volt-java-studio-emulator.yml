name: Experimental Java control studio emulator
on:
  push:
    branches: [arena/e973ac10-volt-plus]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zalith-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise studio on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cd tests/control_engine_build && set -o pipefail && gradle :layer:connectedDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/studio-emulator.log"
      - name: Summarize test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for report in Path('tests/control_engine_build/layer/build/outputs/androidTest-results').rglob('*.xml'):
              suite = ET.parse(report).getroot()
              for case in suite.findall('.//testcase'):
                  for fail in case.findall('failure'):
                      text = (fail.get('message', '') + ' ' + (fail.text or ''))[:1800]
                      print('::notice::' + (case.get('name', '') + ': ' + text).replace('%','%25').replace('\n','%0A'))
          PY
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'studio-emulator.log'
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if ' error:' in line or line.startswith('e: ') or line.startswith('* What went wrong:') or 'FAILURES!!!' in line or 'Exception' in line and ('Caused by' in line or 'Error' in line):
                      for row in lines[i:i+5]: print('::notice::' + row[:350].replace('%','%25'))
